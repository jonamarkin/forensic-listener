# Local development chain for demos and testing, independent of the mainnet node.
#
#   docker compose -f devnet/docker-compose.yml up -d
#   go run .                                   # backend, default settings
#   go run ./cmd/devnet-traffic                # realistic traffic and scenarios
#
# It uses the same ports as ~/ethereum-node, so stop that stack first.
# Nothing is persisted: `docker compose -f devnet/docker-compose.yml down` resets everything.
name: forensic-devnet

services:
  geth:
    image: ethereum/client-go:latest
    container_name: devnet-geth
    command:
      - --dev
      - --dev.period=2
      - --http
      - --http.addr=0.0.0.0
      - --http.api=eth,net,web3,txpool
      - --http.vhosts=*
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.api=eth,net,web3,txpool
      - --ws.origins=*
    ports:
      - "127.0.0.1:8545:8545"
      - "127.0.0.1:8546:8546"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: devnet-postgres
    environment:
      POSTGRES_USER: forensic
      POSTGRES_PASSWORD: forensic
      POSTGRES_DB: blockchain
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forensic -d blockchain"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    container_name: devnet-neo4j
    environment:
      NEO4J_AUTH: neo4j/forensic123
      NEO4J_server_memory_heap_max__size: 1g
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p forensic123 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
